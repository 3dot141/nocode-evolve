<!--
  dev-design-render blessed 模板 — 设计文档 → 单文件 HTML
  用法（见 SKILL.md Step 3 本地 HTML 线）：
  1. 复制本文件为 <topic>-design.html，删除本注释头
  2. 填槽：{{TITLE}}（三处：<title>、nav 头、hero）、{{EYEBROW}}（如「设计文档 · <项目名>」）、
     {{SUMMARY}}（一句话 lede）、{{META}}（日期 · 作者 · 状态）
  3. NAV SLOT：按章节树生成 <a> 列表（层级用 class lv2/lv3）
  4. CONTENT SLOT：填渲染后的文档内容；每个 h2/h3 加 id="sec-N" 与 NAV 对应
  5. 图渲染约定：ASCII 图默认放 <figure class="diagram"><pre>…</pre><figcaption>；
     需要增强的图用 data-render 调用内置布局函数（renderFlow/renderBoxes/renderSequence），
     只填数据（标签/网格坐标/消息序列），禁止手写 SVG path/像素坐标
  6. <style> 与 <script> 块保持原样，除非用户显式要求改外观
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* ---- tokens：组件一律通过 var() 取色，主题切换只动这里 ---- */
  :root {
    --bg: #f6f5f2; --surface: #fffefb; --text: #1a1c1e; --muted: #6b6f76;
    --border: #e3e1dc; --hairline: #eceae5;
    --accent: #1d5c78; --accent-ink: #174a61; --accent-soft: #edf3f6;
    --code-bg: #f0efeb; --ok: #2e7d4f; --bad: #b3382e; --warn: #a1620a;
    --nav-w: 264px;
    --font-display: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
    --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101417; --surface: #171c21; --text: #dfe3e6; --muted: #8b939c;
      --border: #2a323a; --hairline: #21282f;
      --accent: #5cb3d9; --accent-ink: #7cc4e2; --accent-soft: #16303d;
      --code-bg: #12181d; --ok: #57b380; --bad: #e07a70; --warn: #d9a04b;
    }
  }
  /* 主题切换按钮 stamp data-theme，必须双向压过 media query */
  :root[data-theme="light"] {
    --bg: #f6f5f2; --surface: #fffefb; --text: #1a1c1e; --muted: #6b6f76;
    --border: #e3e1dc; --hairline: #eceae5;
    --accent: #1d5c78; --accent-ink: #174a61; --accent-soft: #edf3f6;
    --code-bg: #f0efeb; --ok: #2e7d4f; --bad: #b3382e; --warn: #a1620a;
  }
  :root[data-theme="dark"] {
    --bg: #101417; --surface: #171c21; --text: #dfe3e6; --muted: #8b939c;
    --border: #2a323a; --hairline: #21282f;
    --accent: #5cb3d9; --accent-ink: #7cc4e2; --accent-soft: #16303d;
    --code-bg: #12181d; --ok: #57b380; --bad: #e07a70; --warn: #d9a04b;
  }

  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-body);
    font-size: 15.5px; line-height: 1.85;
    display: flex;
    -webkit-font-smoothing: antialiased;
  }
  code, pre { font-family: var(--font-mono); }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }

  /* ---- 左侧导航 ---- */
  nav#toc {
    width: var(--nav-w); position: fixed; top: 0; bottom: 0; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--surface); padding: 28px 0 60px;
  }
  .toc-eyebrow {
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); padding: 0 24px 6px; font-weight: 600;
  }
  nav#toc .toc-title {
    font-family: var(--font-display); font-weight: 600; font-size: 16.5px; line-height: 1.45;
    padding: 0 24px 18px; margin-bottom: 10px; border-bottom: 1px solid var(--hairline);
    text-wrap: balance;
  }
  nav#toc a {
    display: block; color: var(--muted); text-decoration: none;
    padding: 5.5px 24px; font-size: 13px; line-height: 1.6;
    border-left: 2px solid transparent;
    transition: color .15s;
  }
  nav#toc a.lv3 { padding-left: 40px; font-size: 12.5px; }
  nav#toc a:hover { color: var(--text); }
  nav#toc a.active { color: var(--accent-ink); border-left-color: var(--accent); background: var(--accent-soft); }

  /* ---- 内容区 ---- */
  main#content { margin-left: var(--nav-w); padding: 60px 64px 140px; max-width: 860px; width: 100%; }

  /* hero title block —— 全页唯一的重笔 */
  header.doc-hero { margin-bottom: 64px; }
  .eyebrow {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 14px;
  }
  header.doc-hero h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 40px; line-height: 1.3; letter-spacing: .01em;
    text-wrap: balance; margin-bottom: 16px;
  }
  .lede { font-size: 16.5px; color: var(--muted); line-height: 1.8; max-width: 40em; margin-bottom: 20px; }
  .doc-meta {
    font-size: 12.5px; color: var(--muted); letter-spacing: .04em;
    padding-top: 18px; border-top: 1px solid var(--border);
  }
  .doc-meta::before {
    content: ""; display: block; width: 44px; height: 3px;
    background: var(--accent); margin: -20px 0 18px;
  }

  main h2 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 25px; line-height: 1.4; letter-spacing: .01em;
    margin: 72px 0 18px; padding-top: 28px; border-top: 1px solid var(--hairline);
    text-wrap: balance;
  }
  main h3 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 18.5px; margin: 36px 0 12px;
  }
  main h4 {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 26px 0 10px;
  }
  main p, main li { margin-bottom: 9px; max-width: 44em; }
  main ul, main ol { padding-left: 22px; margin-bottom: 14px; }
  main a { color: var(--accent-ink); text-underline-offset: 3px; }

  code {
    background: var(--code-bg); border: 1px solid var(--hairline);
    border-radius: 4px; padding: 1px 5px; font-size: .84em;
  }
  pre {
    background: var(--code-bg); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 16px 18px; overflow-x: auto; margin: 14px 0 20px;
    font-size: 12.5px; line-height: 1.7;
  }
  pre code { background: none; border: none; padding: 0; }
  blockquote {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    padding: 12px 18px; border-radius: 0 8px 8px 0; margin: 14px 0 20px;
    font-size: 14px; max-width: 46em;
  }
  blockquote p { margin-bottom: 0; }

  /* ---- 表格：sticky 表头 + 可排序 ---- */
  .table-wrap { overflow-x: auto; margin: 14px 0 24px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 16px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  thead th {
    position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none;
    white-space: nowrap; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border);
  }
  thead th:hover { color: var(--accent-ink); }
  thead th[data-dir="asc"]::after { content: " ↑"; color: var(--accent); }
  thead th[data-dir="desc"]::after { content: " ↓"; color: var(--accent); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--accent-soft); }
  td { font-variant-numeric: tabular-nums; }
  .status-ok { color: var(--ok); font-weight: 600; }
  .status-bad { color: var(--bad); font-weight: 600; }
  .status-warn { color: var(--warn); font-weight: 600; }

  /* ---- 图：ASCII 一等公民 + SVG 增强 ---- */
  figure.diagram {
    margin: 18px 0 26px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); overflow: hidden;
  }
  figure.diagram pre { border: none; border-radius: 0; margin: 0; background: var(--surface); }
  figure.diagram [data-render] { padding: 18px 0 8px; }
  figure.diagram figcaption {
    font-size: 12.5px; color: var(--muted); padding: 10px 18px;
    border-top: 1px solid var(--hairline); letter-spacing: .02em;
  }
  figure.diagram figcaption strong, figure.diagram figcaption b { color: var(--text); }
  figure.diagram svg { display: block; margin: 0 auto; max-width: 100%; }
  figure.diagram details { border-top: 1px solid var(--hairline); }
  figure.diagram details summary {
    padding: 7px 18px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); cursor: pointer;
  }
  .svg-node { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.25; }
  .svg-label { fill: var(--text); font-size: 13px; text-anchor: middle; dominant-baseline: middle; font-family: var(--font-body); }
  .svg-edge { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .svg-edge-label { fill: var(--muted); font-size: 11px; text-anchor: middle; font-family: var(--font-body); }
  .svg-lifeline { stroke: var(--border); stroke-dasharray: 4 4; }

  /* ---- 主题切换按钮 ---- */
  #theme-toggle {
    position: fixed; right: 22px; top: 18px; z-index: 10;
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; letter-spacing: .04em; cursor: pointer;
  }
  #theme-toggle:hover { border-color: var(--accent); color: var(--accent-ink); }
  #theme-toggle:focus-visible, nav#toc a:focus-visible, thead th:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  @media (max-width: 900px) {
    nav#toc { display: none; }
    main#content { margin-left: 0; padding: 36px 22px 90px; }
    header.doc-hero h1 { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    nav#toc a { transition: none; }
  }
</style>
</head>
<body>

<nav id="toc">
  <div class="toc-eyebrow">Design Doc</div>
  <div class="toc-title">{{TITLE}}</div>
  <!-- SLOT: NAV — 例：
  <a href="#sec-1">背景</a>
  <a href="#sec-2">方案选择</a>
  <a href="#sec-2-1" class="lv3">决策速查表</a>
  -->
</nav>

<main id="content">
  <header class="doc-hero">
    <p class="eyebrow">{{EYEBROW}}</p>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{SUMMARY}}</p>
    <p class="doc-meta">{{META}}</p>
  </header>
  <!-- SLOT: CONTENT — 渲染后的文档。约定：
    · h2/h3 加 id="sec-N" 与 NAV 对应
    · 表格包 <div class="table-wrap">
    · figcaption 里图编号用 <strong>：<figcaption><strong>图 1</strong> · 域关系总图</figcaption>
    · ASCII 图： <figure class="diagram"><pre>…原文…</pre><figcaption>…</figcaption></figure>
    · SVG 增强图：
      <figure class="diagram">
        <div data-render="flow"     data-spec='{"steps":["解析","校验","入库"]}'></div>
        <div data-render="boxes"    data-spec='{"nodes":[{"id":"a","label":"资源域","col":0,"row":0},{"id":"b","label":"Agent 域","col":1,"row":0}],"edges":[{"from":"a","to":"b","label":"导入"}]}'></div>
        <div data-render="sequence" data-spec='{"actors":["Web","Server","DB"],"messages":[{"from":0,"to":1,"label":"POST /import"},{"from":1,"to":2,"label":"INSERT"}]}'></div>
        <details><summary>ASCII 原文</summary><pre>…</pre></details>
        <figcaption><strong>图 N</strong> · …</figcaption>
      </figure>
  -->
</main>

<button id="theme-toggle" aria-label="切换主题">◐ 主题</button>

<script>
(function () {
  'use strict';
  var SVG = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, cls) {
    var n = document.createElementNS(SVG, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (cls) n.setAttribute('class', cls);
    return n;
  }
  function svgRoot(w, h) {
    var s = el('svg', { viewBox: '0 0 ' + w + ' ' + h, width: w, height: h });
    var defs = el('defs', {});
    var m = el('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
    var p = el('path', { d: 'M 0 0 L 10 5 L 0 10 z' });
    p.style.fill = 'currentColor';
    m.appendChild(p); defs.appendChild(m); s.appendChild(defs);
    return s;
  }
  function node(s, x, y, w, h, label) {
    s.appendChild(el('rect', { x: x, y: y, width: w, height: h, rx: 7 }, 'svg-node'));
    var t = el('text', { x: x + w / 2, y: y + h / 2 }, 'svg-label');
    t.textContent = label; s.appendChild(t);
  }
  function edge(s, x1, y1, x2, y2, label) {
    var l = el('line', { x1: x1, y1: y1, x2: x2, y2: y2, 'marker-end': 'url(#arrow)' }, 'svg-edge');
    l.style.color = 'var(--muted)'; s.appendChild(l);
    if (label) {
      var t = el('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 6 }, 'svg-edge-label');
      t.textContent = label; s.appendChild(t);
    }
  }

  /* 垂直流程图：spec = {steps:["A","B",…]} */
  function renderFlow(host, spec) {
    var W = 300, BH = 44, GAP = 40, w = 200, x = (W - w) / 2;
    var H = spec.steps.length * (BH + GAP) - GAP + 20;
    var s = svgRoot(W, H);
    spec.steps.forEach(function (label, i) {
      var y = 10 + i * (BH + GAP);
      node(s, x, y, w, BH, label);
      if (i < spec.steps.length - 1) edge(s, W / 2, y + BH, W / 2, y + BH + GAP - 4);
    });
    host.appendChild(s);
  }

  /* 网格架构图：spec = {nodes:[{id,label,col,row}], edges:[{from,to,label}]}
     只填 col/row 格子号，像素布局在这里算 */
  function renderBoxes(host, spec) {
    var CW = 230, RH = 120, NW = 170, NH = 52, PAD = 20;
    var maxC = 0, maxR = 0, pos = {};
    spec.nodes.forEach(function (n) { maxC = Math.max(maxC, n.col); maxR = Math.max(maxR, n.row); });
    var s = svgRoot(maxC * CW + NW + PAD * 2, maxR * RH + NH + PAD * 2);
    spec.nodes.forEach(function (n) {
      var x = PAD + n.col * CW, y = PAD + n.row * RH;
      pos[n.id] = { cx: x + NW / 2, cy: y + NH / 2, x: x, y: y };
      node(s, x, y, NW, NH, n.label);
    });
    (spec.edges || []).forEach(function (e) {
      var a = pos[e.from], b = pos[e.to];
      var dx = b.cx - a.cx, dy = b.cy - a.cy, len = Math.hypot(dx, dy) || 1;
      var offA = Math.abs(dx) > Math.abs(dy) ? NW / 2 : NH / 2;
      var offB = offA + 6;
      edge(s, a.cx + dx / len * offA, a.cy + dy / len * offA,
              b.cx - dx / len * offB, b.cy - dy / len * offB, e.label);
    });
    host.appendChild(s);
  }

  /* 时序图：spec = {actors:["A","B"], messages:[{from,to,label,dashed?}]} 索引指 actors */
  function renderSequence(host, spec) {
    var AW = 150, AH = 36, GAP = 46, TOP = 10;
    var W = spec.actors.length * AW + 40;
    var H = TOP + AH + (spec.messages.length + 1) * GAP + 20;
    var s = svgRoot(W, H);
    var cx = spec.actors.map(function (_, i) { return 20 + i * AW + AW / 2; });
    spec.actors.forEach(function (label, i) {
      node(s, cx[i] - 60, TOP, 120, AH, label);
      s.appendChild(el('line', { x1: cx[i], y1: TOP + AH, x2: cx[i], y2: H - 10 }, 'svg-edge svg-lifeline'));
    });
    spec.messages.forEach(function (m, i) {
      var y = TOP + AH + (i + 1) * GAP;
      var l = el('line', { x1: cx[m.from], y1: y, x2: cx[m.to], y2: y, 'marker-end': 'url(#arrow)' }, 'svg-edge');
      if (m.dashed) l.setAttribute('stroke-dasharray', '5 4');
      l.style.color = 'var(--muted)'; s.appendChild(l);
      var t = el('text', { x: (cx[m.from] + cx[m.to]) / 2, y: y - 7 }, 'svg-edge-label');
      t.textContent = m.label; s.appendChild(t);
    });
    host.appendChild(s);
  }

  /* data-render 分发 */
  document.querySelectorAll('[data-render]').forEach(function (host) {
    var spec;
    try { spec = JSON.parse(host.getAttribute('data-spec')); } catch (e) { return; }
    ({ flow: renderFlow, boxes: renderBoxes, sequence: renderSequence }[host.getAttribute('data-render')] || function () {})(host, spec);
  });

  /* 表格点击表头排序 */
  document.querySelectorAll('table').forEach(function (tbl) {
    var body = tbl.tBodies[0];
    if (!body || !tbl.tHead) return;
    Array.prototype.forEach.call(tbl.tHead.rows[0].cells, function (th, ci) {
      th.addEventListener('click', function () {
        var dir = th.getAttribute('data-dir') === 'asc' ? 'desc' : 'asc';
        Array.prototype.forEach.call(tbl.tHead.rows[0].cells, function (h) { h.removeAttribute('data-dir'); });
        th.setAttribute('data-dir', dir);
        Array.prototype.slice.call(body.rows)
          .sort(function (a, b) {
            var x = a.cells[ci].textContent.trim(), y = b.cells[ci].textContent.trim();
            var nx = parseFloat(x), ny = parseFloat(y);
            var c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : x.localeCompare(y, 'zh');
            return dir === 'asc' ? c : -c;
          })
          .forEach(function (r) { body.appendChild(r); });
      });
    });
  });

  /* 导航高亮当前章节 */
  var links = document.querySelectorAll('nav#toc a[href^="#"]');
  var map = {};
  links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting && map[en.target.id]) {
        links.forEach(function (a) { a.classList.remove('active'); });
        map[en.target.id].classList.add('active');
      }
    });
  }, { rootMargin: '0px 0px -70% 0px' });
  Object.keys(map).forEach(function (id) {
    var t = document.getElementById(id);
    if (t) io.observe(t);
  });

  /* 主题切换：data-theme 双向覆盖 media query */
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
