schema_version: 1

supervision:
  interval_ms: 1000
  stable_successes: 2
  failure_threshold: 2

workspaces:
  ui: [agents, web, portal]
  agents: [docker, agents, web, portal]
  full: [docker, agents, server, web, portal]

services:
  docker:
    adapter: docker
    lifecycle: oneshot

  agents:
    adapter: agents
    lifecycle: service
    depends_on:
      docker:
        condition: service_completed_successfully
        required: false

  server:
    adapter: server
    lifecycle: service
    depends_on:
      agents:
        condition: service_healthy
        required: false

  web:
    adapter: web
    lifecycle: service
    depends_on:
      agents:
        condition: service_healthy
        required: false
        propagate_restart: true
      server:
        condition: service_healthy
        required: false

  # portal 无 depends_on：经 :10001 反代访问时 API 走 jsy-web 的 proxy 链路，
  # 自身可独立起停；:10002 直连入口的后端指向由 portal-cli 注入的 USER_CLIENT 决定。
  portal:
    adapter: portal
    lifecycle: service
